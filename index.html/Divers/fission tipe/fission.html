<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name = "description" content = "Simulation d'une réaction en chaîne de fissions 
    dans une barre d'uranium." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel = "stylesheet" type="text/css" href = "/style/nav.css">
    <link rel="stylesheet" type="text/css" href="/style/footer.css"/>
    <title>Fission</title>
    <!-- <link rel="stylesheet" href="virus.css"> -->
    <script src="./js/main.js" defer></script>
    <style>
        canvas {
            background-color: #333;
        }
        #collisions, #screen {
            border: 1px solid #aaa;
        }
    </style>
</head>

<body>
    
    <!-- NAV --> 
    <header class = "site_header">
        <!-- Contenu appelé par JS -->
    </header>

    <script>
        fetch('/nav/nav.html')                // lance la requête HTTP GET vers /nav.html — retourne une Promise
        .then(response => response.text()) // quand la requête réussit, convertit la réponse en texte — retourne une nouvelle Promise
        .then(html => document.querySelector('header').innerHTML = html) // quand le texte est prêt, l'insère dans la page
        .catch(err => console.error('Nav load failed', err)); // si une étape échoue, on gère l'erreur ici
    </script>    

    <canvas id="screen" width=800 height=600></canvas>
    <canvas id="collisions" width=800 height=200></canvas>
</body>

<footer class="site-footer" role="contentinfo">
    <time datetime="2021-10-01">MAJ : Octobre 2021 </time>
    <span class="name"> © Pierre F.</span>
</footer>

</html>
