<!DOCTYPE html>

<html lang="fr">

<head>
    <meta charset="UTF-8"/>
    <meta name = "description" content = "Jeu vidéo Snake." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Snake</title>
    <script src="./js/main2.js" defer></script>
    <link rel="stylesheet" type="text/css" href="Style.css"/>
    <link rel = "stylesheet" type="text/css" href = "../../../style/nav.css">
    <link rel="stylesheet" type="text/css" href="../../../style/footer.css"/>
    <!-- <link rel="icon" href="./Images/snake-logo.ico" /> -->
</head>

<body>
    <!-- NAV --> 
    <header class = "site_header">
        <!-- Contenu appelé par JS -->
    </header>

    <script>
        fetch('/nav/nav.html')                // lance la requête HTTP GET vers /nav.html — retourne une Promise
        .then(response => response.text()) // quand la requête réussit, convertit la réponse en texte — retourne une nouvelle Promise
        .then(html => document.querySelector('header').innerHTML = html) // quand le texte est prêt, l'insère dans la page
        .catch(err => console.error('Nav load failed', err)); // si une étape échoue, on gère l'erreur ici
    </script>    

    <main>
    <div class="cadre_du_jeu">
        <canvas id="screen" width=900 height=900></canvas>

        <!-- Menu -->
        <div class="menu_jeu"> 
            <div id = "menu">
                <h1 class = "element_menu"> Snake </h1>
                <p class = "element_menu"> Choose mode : </p>
                <div class = "element_menu" style = "margin-top: 5%";>
                    <span id="boutonEasy"> Easy </span>
                    <span id="boutonMedium"> Medium </span>
                    <span id="boutonHard"> Hard </span>
                </div>
            </div>

            <!-- Interface -->
            <div>
                <h2 id = "gameOver">
                    Game Over
                    <!-- <a href="Snake.html"> Game Over! </a> -->
                </h2>

                <h2 id = "bestScore">
                    Best Score!
                    <!-- <a href="Snake.html"> Best Score! </a> -->
                </h2>
                <h2 id = "countdown"></h2>
            </div>
        </div>

        <!-- niveau -->
        <span id = "lvl"> </span>

        <!-- score et best score -->
        <span class = "scores">
            <span id = "score"></span>
            <span id = "best_score"></span>
        </span>
    </div>

    <!-- adds sur les côtés pour combler le vide -->
    <div id = "addleft"></div>
    <div id = "addright"></div>

    <!-- fleches mobile -->
    <div class = "arrows">
        <div id = 'arrowup' class = "arrow-up"></div>
        <div id = 'arrowright' class = "arrow-right"></div>
        <div id = 'arrowdown' class = "arrow-down"></div>
        <div id = 'arrowleft' class = "arrow-left"></div>
    </div>

    <!-- bouton quitter le jeu -->
    <!-- <a href = "../Jeux.html" id = "leave_game"> Quit </a> -->
    
    </main>
    
    <footer class="site-footer" role="contentinfo">
        <time datetime="2023-10-01">MAJ : Octobre 2023 </time>
        <span class="name"> © Pierre F.</span>
    </footer>
</body>

</html>
